applications:
  - name: shift-ho-approuter
    path: app-router
    memory: 256M
    buildpacks:
      - nodejs_buildpack
    env:
      destinations: >
        [{"name":"shift-ho-backend","url":"https://shift-ho-dashboard.cfapps.eu01-canary.hana.ondemand.com","forwardAuthToken":true}]
    services:
      - shift-ho-xsuaa

  - name: shift-ho-dashboard
    memory: 512M
    disk_quota: 512M
    buildpacks:
      - python_buildpack
    command: gunicorn wsgi:application --workers 2 --timeout 120
    services:
      - ECS-handover-dashboard-db
      - shift-ho-xsuaa
      - shift-ho-alerts
    env:
      PYTHON_VERSION: 3.12.x

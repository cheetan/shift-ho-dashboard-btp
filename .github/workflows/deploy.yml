name: Deploy to SAP BTP Cloud Foundry

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CF CLI
        run: |
          CF_URL=$(curl -fsSL https://api.github.com/repos/cloudfoundry/cli/releases/latest \
            | jq -r '[.assets[] | select(.name | test("cf8.*linux_x86-64\\.tgz$"))][0].browser_download_url')
          curl -fsSL -o cf-cli.tgz "$CF_URL"
          tar -zxf cf-cli.tgz
          sudo mv cf8 /usr/local/bin/cf
          cf version

      - name: CF Login
        run: |
          cf login \
            -a "${{ secrets.CF_API }}" \
            -u "${{ secrets.CF_USERNAME }}" \
            -p "${{ secrets.CF_PASSWORD }}" \
            -o "${{ secrets.CF_ORG }}" \
            -s "${{ secrets.CF_SPACE }}"

      - name: Deploy
        run: cf push --no-start

      - name: Set HANA credentials
        run: |
          cf set-env shift-ho-dashboard HANA_HOST "${{ secrets.HANA_HOST }}"
          cf set-env shift-ho-dashboard HANA_PORT "443"
          cf set-env shift-ho-dashboard HANA_USER "${{ secrets.HANA_USER }}"
          cf set-env shift-ho-dashboard HANA_PASSWORD "${{ secrets.HANA_PASSWORD }}"
          cf set-env shift-ho-dashboard UPLOAD_API_KEY "${{ secrets.UPLOAD_API_KEY }}"
          cf set-env shift-ho-dashboard GITHUB_ISSUES_TOKEN "${{ secrets.GH_ISSUES_TOKEN }}"

      - name: Start apps
        run: |
          cf start shift-ho-dashboard
          cf start shift-ho-approuter

      - name: Verify health
        run: |
          sleep 15
          curl -f https://shift-ho-approuter.cfapps.eu01-canary.hana.ondemand.com/health
